name: Update Pins

# Manual: the full pin-refresh verification (`make update-pins`) on Linux, where
# every pin kind can be exercised — release-asset tools install as pinned Linux
# binaries here, and the combined run includes the Docker Compose stack. Report
# and per-pin logs are uploaded; nothing is written back to the repository.
on:
  workflow_dispatch:

# One verification at a time per ref; a second dispatch waits for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Repositories are UTC internally (governance/devsecops.md): every step runs in UTC.
env:
  TZ: UTC

jobs:
  update-pins:
    name: Update Pins (verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Verify every stale pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_PINS_LOGDIR: target/update-pins/logs
        run: make update-pins REPORT=target/update-pins/report.txt
      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: update-pins
          path: target/update-pins/
          if-no-files-found: warn
