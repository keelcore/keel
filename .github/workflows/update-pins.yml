name: Update Pins

# Manual: the full pin-refresh verification (`make update-pins`) on Linux, where
# every pin kind can be exercised — release-asset tools install as pinned Linux
# binaries here, and the combined run includes the Docker Compose stack. Report
# and per-pin logs are uploaded; nothing is written back to the repository.
on:
  workflow_dispatch:

# One verification at a time per ref; a second dispatch waits for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Repositories are UTC internally (governance/devsecops.md): every step runs in UTC.
env:
  TZ: UTC

jobs:
  update-pins:
    name: Update Pins (verify)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed  # v5.1.0
        with:
          go-version-file: go.mod
      - name: Install bats-core
        run: make setup-bats
      - name: Install pebble
        run: make setup-pebble
      - name: Install staticcheck
        run: make setup-staticcheck
      - name: Install markdownlint
        run: make setup-markdownlint
      - name: Install helm
        run: make setup-helm
      - name: Verify every stale pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_PINS_LOGDIR: target/update-pins/logs
        run: make update-pins REPORT=target/update-pins/report.txt
      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.5.0
        with:
          name: update-pins
          path: target/update-pins/
          if-no-files-found: warn
