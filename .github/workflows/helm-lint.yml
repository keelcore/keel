name: Helm Lint

on:
  push:
    branches: [main]
    paths: ['helm/**']
  pull_request:
    branches: [main]
    paths: ['helm/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Repositories are UTC internally (governance/devsecops.md): every step runs in UTC.
env:
  TZ: UTC

jobs:

  # ---------------------------------------------------------------------------
  # Helm Lint — validates chart syntax and renders the template.
  # Triggered only when helm/** changes to avoid unnecessary runs.
  # IMPORTANT: do not make this the only required status check for PRs that
  # also change non-helm files; path filters can inadvertently skip it.
  # ---------------------------------------------------------------------------
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install kind and create cluster
        run: make setup-kind
      - name: Lint chart
        run: make lint-helm

  # ---------------------------------------------------------------------------
  # Helm Policy — kubescape on the rendered chart (library and sidecar mode).
  # Allowed controls and their reasons are listed in scripts/lint/helm-policy.sh.
  # ---------------------------------------------------------------------------
  helm-policy:
    name: Helm Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Chart policy scan
        run: make lint-helm-policy
