name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'
  branch_protection_rule:
  workflow_dispatch:

# Scorecard verifies its own workflow before publishing results: no workflow- or
# job-level env, defaults, containers or services, and only the actions below.
permissions: read-all

jobs:

  # ---------------------------------------------------------------------------
  # OpenSSF Scorecard — scores repository security practices (branch
  # protection, pinned actions, SAST, signed releases, ...) and uploads the
  # findings to code scanning. Guards the DevSecOps repository controls
  # (rulesets, environment, secret scanning) against silent regression.
  # ---------------------------------------------------------------------------
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e  # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          sarif_file: results.sarif
