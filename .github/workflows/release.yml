name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# No concurrency control: release runs must complete; never cancel them.

# Default: least privilege. Each job escalates only what it needs.
permissions:
  contents: read

# Repositories are UTC internally (governance/devsecops.md): every step runs in UTC.
env:
  TZ: UTC

# ci-passed → build → approve → sign-blobs, attest-blobs, images, helm (side by side)
#                             → upload (blobs), image-provenance (one per flavor)
#                             → verify → publish
jobs:

  # ---------------------------------------------------------------------------
  # CI passed — waits for every earlier workflow run on this commit to finish, and fails if any is
  # red, so a red commit is never published.
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed on this commit
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - run: make wait-for-ci
        env:
          GH_TOKEN: ${{ github.token }}

  # ---------------------------------------------------------------------------
  # Build — produce linux/amd64 and linux/arm64 release artifacts for Docker image delivery.
  # The canonical artifact is built once here and promoted to release.
  # Windows and macOS portability is validated in CI but those binaries are
  # not released; the Docker image is the distribution vehicle for all platforms.
  # ---------------------------------------------------------------------------
  build:
    name: Build Release Artifacts
    needs: ci-passed
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      # Each flavor for each architecture, concurrently. docker.sh pairs each flavor's amd64 and
      # arm64 binaries into one multi-arch image index.
      - name: Build release binaries
        run: make build-release-binaries
      # One SBOM per release binary (keel, its version, the Go modules compiled into it); docker.sh
      # adds one per image. OpenVEX from govulncheck reachability, generated from the code being
      # released; docker.sh attests it to every image index. TAG reaches the run line from the
      # environment, never by expression.
      - name: Generate SBOMs and OpenVEX
        env:
          TAG: ${{ github.ref_name }}
        run: make generate-release-metadata
      - name: Validate OpenVEX
        run: make lint-vex
      - name: Generate checksums
        run: make generate-release-checksums
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-artifacts
          path: dist/
          # Retain for 7 days to allow post-release investigation if needed.
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Approve — the one human gate: the release environment has a required
  # reviewer and accepts only v* tags. Every publishing job waits for this one.
  # ---------------------------------------------------------------------------
  approve:
    name: Approve and Verify Artifacts
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-artifacts
          path: dist/
      - name: Verify artifact checksums
        run: make verify-release-checksums

  # ---------------------------------------------------------------------------
  # Sign — sign each artifact (cosign keyless, GitHub OIDC).
  # ---------------------------------------------------------------------------
  sign-blobs:
    name: Sign Artifacts
    needs: approve
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-artifacts
          path: dist/
      - name: Sign artifacts
        run: make sign-release ARGS="--sums-dir dist dist/keel-*"
      # Signing runs in the dev image (root on a Linux runner); hand dist/ back to the runner user.
      - name: Hand dist back to the runner
        run: make set-dist-permissions
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: signed-blobs
          path: |
            dist/*.bundle
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Attest — SLSA provenance for each artifact.
  # ---------------------------------------------------------------------------
  attest-blobs:
    name: Attest Artifacts
    needs: approve
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-artifacts
          path: dist/
      - name: Generate SLSA provenance attestation
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'dist/keel-*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: blob-provenance
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Images — build, scan, push and sign the container images.
  # ---------------------------------------------------------------------------
  images:
    name: Publish Images
    needs: approve
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      max_digest: ${{ steps.images.outputs.max_digest }}
      min_digest: ${{ steps.images.outputs.min_digest }}
      fips_digest: ${{ steps.images.outputs.fips_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-artifacts
          path: dist/
      # Artifacts lose their mode in transit: the images need executable binaries.
      - name: Make the binaries executable
        run: make set-dist-permissions
      - name: Build, scan, push and sign container images
        id: images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: make publish-release-images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: image-sboms
          path: dist/sbom-*.spdx.json
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Helm — package, push and sign the chart.
  # ---------------------------------------------------------------------------
  helm:
    name: Publish Helm Chart
    needs: approve
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - name: Package and push Helm chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: make push-helm-chart

  # ---------------------------------------------------------------------------
  # Upload — attach the artifacts, their signatures and provenance to the draft release.
  # ---------------------------------------------------------------------------
  upload:
    name: Upload to GitHub Release
    needs: [sign-blobs, attest-blobs]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-artifacts
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signed-blobs
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: blob-provenance
          path: provenance/
      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PROVENANCE_BUNDLE: provenance
        run: make upload-release

  # ---------------------------------------------------------------------------
  # Image provenance — SLSA provenance per image digest, pushed to GHCR next to each image.
  # ---------------------------------------------------------------------------
  image-provenance:
    name: Image Provenance
    needs: images
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [max, min, fips]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      # The attestation is pushed by the action, through the runner's docker login.
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: make login-ghcr
      - name: Image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/keelcore/keel
          subject-digest: ${{ needs.images.outputs[format('{0}_digest', matrix.flavor)] }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # Verify — the release verifies its own output: signatures, SBOM, VEX and
  # provenance attestations on every image and blob, aliases, chart.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify Published Release
    needs: [images, helm, upload, image-provenance]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-artifacts
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signed-blobs
          path: dist/
      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_DIGEST: ${{ needs.images.outputs.max_digest }}
          MIN_DIGEST: ${{ needs.images.outputs.min_digest }}
          FIPS_DIGEST: ${{ needs.images.outputs.fips_digest }}
        run: make verify-release

  # ---------------------------------------------------------------------------
  # Publish — immutable releases: every asset is attached to the draft first; publishing locks it.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Release
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: image-sboms
          path: dist/
      - name: Attach image SBOMs and publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: make upload-release ARGS="--publish"
