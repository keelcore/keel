name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# No concurrency control: release runs must complete; never cancel them.

# Default: least privilege. The publish job escalates only what it needs.
permissions:
  contents: read

# Repositories are UTC internally (governance/devsecops.md): every step runs in UTC.
env:
  TZ: UTC

jobs:

  # ---------------------------------------------------------------------------
  # Build — produce linux/amd64 and linux/arm64 release artifacts for Docker image delivery.
  # The canonical artifact is built once here and promoted to release.
  # Windows and macOS portability is validated in CI but those binaries are
  # not released; the Docker image is the distribution vehicle for all platforms.
  # ---------------------------------------------------------------------------
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - name: Build min
        run: make min
      - name: Build max (no FIPS)
        run: make max-no-fips
      - name: Build max (FIPS) + verify symbols
        run: make max
      - name: Rename artifacts with platform suffix
        run: make release-rename
      # linux/arm64: the same three builds, cross-compiled (CGO_ENABLED=0), then
      # renamed with the arm64 suffix. docker.sh pairs each flavor's amd64 and
      # arm64 binaries into one multi-arch image index.
      - name: Build min (linux/arm64)
        env:
          GOARCH: arm64
        run: make min
      - name: Build max (no FIPS, linux/arm64)
        env:
          GOARCH: arm64
        run: make max-no-fips
      - name: Build max (FIPS, linux/arm64) + verify symbols
        env:
          GOARCH: arm64
        run: make max
      - name: Rename arm64 artifacts with platform suffix
        env:
          GOARCH: arm64
        run: make release-rename
      # One SBOM per release binary (keel, its version, the Go modules compiled into it); docker.sh
      # adds one per image. TAG reaches the run line from the environment, never by expression.
      - name: Generate SBOMs
        env:
          TAG: ${{ github.ref_name }}
        run: make release-sbom ARGS="--out-dir dist --name keel --version ${TAG} --license Apache-2.0 dist/keel-*"
      # OpenVEX from govulncheck reachability, generated from the code being released;
      # docker.sh attests it to every image index.
      - name: Generate OpenVEX
        run: make release-vex ARGS="--out-dir dist"
      - name: Validate OpenVEX
        run: make lint-vex
      - name: Generate checksums
        run: make release-checksums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-artifacts
          path: dist/
          # Retain for 7 days to allow post-release investigation if needed.
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publish — download the already-built artifacts, verify checksums, sign,
  # and upload to GitHub Release. Requires human approval: the release
  # environment has a required reviewer and accepts only v* tags.
  #
  # Permissions elevated only in this job:
  #   contents: write — create the GitHub Release and upload assets
  #   id-token: write — OIDC token for cosign keyless signing
  # ---------------------------------------------------------------------------
  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-artifacts
          path: dist/
      - name: Verify artifact checksums
        run: make release-checksums-verify
      - name: Sign artifacts
        run: make release-sign ARGS="--sums-dir dist dist/keel-*"
      # Signing runs in the dev image (root on a Linux runner); hand dist/ back to the runner user.
      - name: Hand dist back to the runner
        run: make dist-chmod
      - name: Generate SLSA provenance attestation
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-path: 'dist/keel-*'
      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: make release-upload
      - name: Build, scan, push and sign container images
        id: images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: make release-docker
      # SLSA provenance per image digest, pushed to GHCR next to each image.
      - name: Image provenance (max)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-name: ghcr.io/keelcore/keel
          subject-digest: ${{ steps.images.outputs.max_digest }}
          push-to-registry: true
      - name: Image provenance (min)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-name: ghcr.io/keelcore/keel
          subject-digest: ${{ steps.images.outputs.min_digest }}
          push-to-registry: true
      - name: Image provenance (fips)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2.4.0
        with:
          subject-name: ghcr.io/keelcore/keel
          subject-digest: ${{ steps.images.outputs.fips_digest }}
          push-to-registry: true
      - name: Package and push Helm chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: make release-helm-push
      # Last step: the release verifies its own output — signatures, SBOM, VEX
      # and provenance attestations on every image and blob, aliases, chart.
      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_DIGEST: ${{ steps.images.outputs.max_digest }}
          MIN_DIGEST: ${{ steps.images.outputs.min_digest }}
          FIPS_DIGEST: ${{ steps.images.outputs.fips_digest }}
        run: make release-verify
