name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same branch/PR.
# Keep main-branch runs to completion so history is complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Default: least privilege. Jobs that need more declare it explicitly.
permissions:
  contents: read

# Repositories are UTC internally (governance/devsecops.md): every step runs in UTC.
env:
  TZ: UTC

jobs:

  # ---------------------------------------------------------------------------
  # PR Policy — required gate; runs before build and test jobs.
  # All policy logic lives in scripts/ci/pr-policy.sh.
  # ---------------------------------------------------------------------------
  pr-policy:
    name: PR Policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Check PR policy
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make ci-pr-policy

  # ---------------------------------------------------------------------------
  # CI Audit — required gate; verifies all run: steps are make <target>,
  # all scripts have targets, and universal canonical targets exist.
  # ---------------------------------------------------------------------------
  ci-audit:
    name: CI Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run CI/Makefile audit
        run: make audit
      - name: Verify canonical scripts are byte-identical to .standards
        run: make verify-canonical

  # ---------------------------------------------------------------------------
  # Secret Scan — required gate; runs on every push and PR.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Scan for secrets
        run: make ci-secret-scan

  # ---------------------------------------------------------------------------
  # Consistency — verifies Go config struct, Helm values, configmap template,
  # and config-reference.md are globally in sync.
  # ---------------------------------------------------------------------------
  consistency:
    name: Consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Helm
        run: make setup-helm
      - name: Run consistency suite
        run: make test-consistency

  # ---------------------------------------------------------------------------
  # Lint — aggregates: go vet + staticcheck, markdownlint, trailing newlines.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Lint
        run: make lint

  # ---------------------------------------------------------------------------
  # Security gates — dependency vulnerabilities (govulncheck), Go SAST (gosec),
  # a short fuzz pass over every native Go fuzz target, workflow security lint
  # (actionlint, zizmor), and the dependency license allowlist.
  # ---------------------------------------------------------------------------
  vuln:
    name: Vulnerability Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: govulncheck
        run: make lint-vuln

  gosec:
    name: SAST (gosec)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: gosec
        run: make lint-gosec

  fuzz:
    name: Fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Fuzz (10s per target)
        run: make test-fuzz

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: actionlint + zizmor
        env:
          # zizmor online audits (impostor commits, pin/version drift, known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}
        run: make lint-workflows

  licenses:
    name: Licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: License allowlist
        run: make lint-licenses

  # ---------------------------------------------------------------------------
  # Unit Tests — compile and run on all three supported platforms.
  # Matrix validates runtime compatibility; the binary is NOT reused across
  # platforms here because go test compiles a test binary for each target.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Unit tests
        run: make test-unit
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # v7.0.0 — v5.x fetched Codecov's old (bricked) Keybase signing key and
        # failed GPG verification of the uploader ("No public key"). v6.0.2/v7.0.0
        # use the current key, so the upload verifies and succeeds.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: target/coverage.txt
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Native platforms — the dev image cross-builds everything a macOS or Windows
  # host runs (test binaries, keel, pebble, bats, TLS fixtures); the native jobs
  # only execute it. No toolchain is installed on the native runners.
  # ---------------------------------------------------------------------------
  native-build:
    name: Native build (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: darwin
            arch: arm64
          - platform: windows
            os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Cross-build native test binaries and keel
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: make native-build
      - name: Generate TLS certs
        run: make gen-certs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: native-${{ matrix.platform }}
          path: |
            target/native/
            dist/
            tests/fixtures/certs/
          retention-days: 1

  unit-native:
    name: Unit (${{ matrix.platform }})
    needs: native-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-26
            dir: target/native/darwin-arm64
          - platform: windows
            runner: windows-2025-vs2026
            dir: target/native/windows-amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: native-${{ matrix.platform }}
      - name: Run native unit tests
        shell: bash
        env:
          DIR: ${{ matrix.dir }}
        run: make native-run

  # ---------------------------------------------------------------------------
  # Coverage Delta — PR-only gate. Measures coverage at the merge-target commit
  # (base), then at the PR head, and fails if the drop exceeds 1 percentage point.
  # No stored baseline; the base branch is measured live on every PR.
  # ---------------------------------------------------------------------------
  coverage-delta:
    name: Coverage Delta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Check coverage delta
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          COVERAGE_THRESHOLD: '1.0'
        run: make ci-coverage-delta

  # ---------------------------------------------------------------------------
  # Coverage No-Regression — per-file gate against the committed baseline at
  # tests/coverage-baseline.lcov. Runs on push AND pull_request so direct
  # pushes to main are gated too (a PR-only gate would miss them). Fails on any
  # per-file ratio below its baseline or a new file below the 95% floor.
  # ---------------------------------------------------------------------------
  coverage-no-regression:
    name: Coverage No-Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Generate coverage LCOV
        shell: bash
        run: make coverage
      - name: Per-file no-regression gate
        shell: bash
        run: make ci-coverage-no-regression

  # ---------------------------------------------------------------------------
  # Build — produce linux/amd64 binaries for Docker image delivery.
  # Artifacts are uploaded for downstream integrity validation.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build min
        run: make min
      - name: Build max (no FIPS)
        run: make max-no-fips
      - name: Generate checksums
        run: make release-checksums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist-linux
          path: dist/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Build (FIPS) — linux/amd64 FIPS build with compile-time symbol verification.
  # Kept as a separate job because the FIPS toolchain path and timeout differ.
  # ---------------------------------------------------------------------------
  build-fips:
    name: Build (FIPS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Build FIPS + verify symbols
        run: make max
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist-fips
          path: dist/keel-fips
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Integrity — BATS suite validates the built artifact, not a hypothetical.
  # Downloads the artifact produced by the build job before running tests.
  # ---------------------------------------------------------------------------
  integrity:
    name: Integrity (BATS)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist-linux
          path: dist/
      - name: Verify artifact checksums
        run: make release-checksums-verify
      - name: Make binaries executable
        run: make dist-chmod
      - name: Generate TLS certs
        run: make gen-certs
      - name: Run integrity suite
        run: make bats-integrity

  # ---------------------------------------------------------------------------
  # Integrity (macOS) — portability validation on darwin/arm64; confirms the
  # binary compiles and BATS signal tests pass on Darwin. Not a release artifact.
  # ---------------------------------------------------------------------------
  integrity-macos:
    name: Integrity (BATS, macOS)
    needs: native-build
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: native-macos
      # The suite bounds process runs with timeout(1), which macOS does not ship.
      - name: Install timeout
        run: make setup-bats-local
      - name: Run integrity suite (darwin binaries from the dev image)
        env:
          DIR: target/native/darwin-arm64
        run: make native-integrity

  # ---------------------------------------------------------------------------
  # Example (BATS) — builds examples/myapp, generates TLS certs, runs myapp.bats.
  # Validates the library-mode usage pattern end-to-end.
  # ---------------------------------------------------------------------------
  example:
    name: Example (BATS)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Generate TLS certs
        run: make gen-certs
      - name: Build myapp
        run: make ci-build-example
      - name: Run example BATS suite
        run: make bats-example

  # ---------------------------------------------------------------------------
  # Windows Smoke — portability validation on windows/amd64; confirms the
  # no-op signal stub compiles and the binary starts cleanly. Not a release artifact.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Compose Integration — spins up the tests/compose/docker-compose.test.yaml topology
  # (keel max-flavor + upstream + observability stack), runs all compose tests
  # including the HTTP/3 QUIC probe, then tears down.
  # Runs on ubuntu-24.04 only (Docker Compose not available on macOS/Windows
  # GHA runners without additional setup).
  # ---------------------------------------------------------------------------
  compose:
    name: Compose Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run compose integration tests
        env:
          KEEL_COMPOSE_TESTS: "1"
        run: make test-compose

  # ---------------------------------------------------------------------------
  # Kubernetes (kind) — builds keel:test image, loads it into a single-node
  # kind cluster, deploys via Helm, then runs pod readiness + probe + restart
  # tests. Runs on ubuntu-24.04 only; downloads dist-linux artifact.
  # ---------------------------------------------------------------------------
  k8s:
    name: Kubernetes (kind)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Helm
        run: make setup-helm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist-linux
          path: dist/
      - name: Make binaries executable
        run: make dist-chmod
      - name: Run k8s integration tests
        run: make test-k8s

  build-windows-smoke:
    name: Windows Smoke
    needs: native-build
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: native-windows
      - name: Smoke test (windows binary from the dev image)
        shell: bash
        run: make ci-smoke-windows
