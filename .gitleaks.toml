title = "Keel Gitleaks Config"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Allowlists — false positives suppressed here; document the reason clearly.
# Gitleaks reads this file from the working tree even when scanning history,
# so entries here suppress both current and historical findings.
# ---------------------------------------------------------------------------

[[allowlists]]
id          = "authn-test-fixtures"
description = "Short literal strings used as HMAC test-fixture keys in authn_test.go and authn_signer_test.go (now pkg/core/mw/authn_jwt_test.go); entropy matches generic-api-key but these are not real secrets"
paths       = ['''tests/unit/authn_test\.go''', '''tests/unit/authn_gaps_test\.go''', '''tests/unit/authn_signer_test\.go''', '''pkg/core/mw/authn_jwt_test\.go''']
regexes     = ['''"0123456789abcdef"''', '''"fedcba9876543210"''', '''"wrong-key-16byte"''']

[[allowlists]]
id          = "acme-marshal-func-alias"
description = "Go source identifier 'marshalECKey = x509.MarshalECPrivateKey' in acme/manager.go; the generic-api-key rule matches its entropy, but it is a function alias, not a secret"
paths       = ['''pkg/core/acme/manager\.go''']
regexes     = ['''marshalECKey\s+= x509\.MarshalECPrivateKey''']

[[allowlists]]
id          = "tlscert-marshal-func-seam"
description = "Go source identifier 'marshalECPrivateKey = x509.MarshalECPrivateKey' in tests/unit/tlscert.go, a test seam; the generic-api-key rule matches its entropy, but it is a function alias, not a secret"
paths       = ['''tests/unit/tlscert\.go''']
regexes     = ['''marshalECPrivateKey\s+= x509\.MarshalECPrivateKey''']

[[allowlists]]
id          = "bats-admin-token-fixture"
description = "Literal bearer token 'bats-admin-token' passed to a throwaway keel process via KEEL_ADMIN_TOKEN in tests/integrity.bats; curl-auth-header matches the Authorization header, but it is a test fixture, not a secret"
paths       = ['''tests/integrity\.bats''']
regexes     = ['''Bearer bats-admin-token''']

[[allowlists]]
id          = "hop-header-client-jwt-fixture"
description = "Fake unsigned client JWT (sub=client, signature 'signature') in hop_test.go, used to show a client token reaches the upstream byte-identical; the jwt rule matches its shape, but it is a test fixture, not a credential"
paths       = ['''pkg/core/sidecar/hop_test\.go''']
regexes     = ['''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJjbGllbnQifQ\.c2lnbmF0dXJl''']

[[allowlists]]
id          = "audit-events-hmac-fixture"
description = "Literal HMAC key auditTestSecret in audit_events_test.go (now authn_jwt_test.go), signing tokens for an in-process test; generic-api-key matches its name and entropy, but it is a test fixture, not a secret"
paths       = ['''pkg/core/mw/audit_events_test\.go''', '''pkg/core/mw/authn_jwt_test\.go''']
regexes     = ['''0123456789abcdef0123456789abcdef''']
