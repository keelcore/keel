## Keel Helm chart values
## values.keel takes every field of the config schema (pkg/config/schema.yaml); see Keel config below.

replicaCount: 1

# library  = single Keel container; your Go code links keel as a library.
# sidecar  = two containers (app + keel); keel wraps an existing service.
mode: sidecar

image:
  repository: ghcr.io/keelcore/keel
  # Empty → "v" + Chart appVersion (the release this chart was published with).
  tag: ""
  # default | min | fips | custom — min and fips append "-min" / "-fips" to the
  # tag, selecting the image built with those compile-time build tags.
  flavor: default
  # sha256:... — pins the exact image and takes precedence over tag and flavor.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ── Sidecar app container (mode: sidecar only) ────────────────────────────────
sidecar:
  app:
    image: ""          # required when mode: sidecar
    tag: latest
    pullPolicy: IfNotPresent
    port: 3000
    args: []
    env: []
    resources: {}
    securityContext: {}

# ── Keel config ───────────────────────────────────────────────────────────────
# values.keel takes every value and attribute the config schema defines
# (pkg/config/schema.yaml; docs/config-reference.md), with the schema's names
# and nesting: keel.yaml's tree, rendered to /etc/keel/keel.yaml, the global
# config file (KEEL_KNOBS_GLOBAL_PATH). A field left out takes keel's default.
# Listed below: the fields the chart reads or sets differently from keel's
# defaults, and the chart's own keys (config, secrets, mounts, extra*), which
# are not schema fields. Secrets (admin.token, admin.metrics_token,
# authn.oidc.client_secret) belong in keel.secrets, or in the environment
# (KEEL_ADMIN_TOKEN, KEEL_ADMIN_METRICS_TOKEN, KEEL_AUTHN_OIDC_CLIENT_SECRET).
keel:
  # keel.yaml settings applied last, over everything above and what the chart
  # derives (sidecar.enabled from mode, file paths of keel.mounts).
  config: {}

  # k8s Secret holding keel-secrets.yaml (key "keel-secrets.yaml"), the secrets
  # file (KEEL_KNOBS_SECRETS_PATH), mounted at mountPath/keel-secrets.yaml.
  secrets:
    existingSecret: ""
    mountPath: /etc/keel/secrets
    # Copies the Secret into an owner-only file for keel (knobs requires mode 0600).
    initImage: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f

  # Kubernetes sources of keel's files; the chart sets the matching file paths.
  mounts:
    # Secret of type kubernetes.io/tls (tls.crt, tls.key): tls.cert_file, tls.key_file.
    # Leave empty when using ACME or when TLS is terminated upstream.
    tlsSecret: ""
    # Secret holding ca.crt: tls.client_ca_file (inbound mTLS; HTTPS/H3 require
    # client certs signed by it).
    clientCASecret: ""
    # Secret with ca.crt, tls.crt, tls.key: sidecar.upstream_tls.* (sidecar mode).
    upstreamTLSSecret: ""
    # PVC (ReadWriteOnce or ReadWriteMany) mounted at tls.acme.cache_dir.
    acmeCachePVC: ""

  # The Deployment, Service and NetworkPolicy open these ports.
  listeners:
    http:
      enabled: true
      port: 8080
    https:
      enabled: false
      port: 8443
    h3:
      enabled: false
      port: 8443
    health:
      enabled: true
      port: 9091
    ready:
      enabled: true
      port: 9092
    startup:
      enabled: false
      port: 9093
    admin:
      enabled: false
      port: 9999

  tls:
    acme:
      # Where keel.mounts.acmeCachePVC is mounted.
      cache_dir: /var/lib/keel/acme

  sidecar:
    # In sidecar mode the app runs on localhost. Keep in sync with sidecar.app.port.
    upstream_url: "http://localhost:3000"

  fips:
    monitor: true

  extraEnv: []
  extraArgs: []
  extraVolumeMounts: []
  extraVolumes: []

# ── Kubernetes Service ────────────────────────────────────────────────────────
service:
  type: ClusterIP
  annotations: {}
  http:
    enabled: true
    port: 80
  https:
    enabled: false
    port: 443
  h3:
    enabled: false
    port: 443

# Probe ports are hit by kubelet on PodIP; they don't need a Service.
# Enable only if you need in-cluster access to probe endpoints.
serviceProbes:
  enabled: false
  healthPort: 9091
  readyPort: 9092
  startupPort: 9093

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: keel.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ── Prometheus Operator ServiceMonitor ────────────────────────────────────────
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  # targetPort is the admin port name; must match containerPort name "admin".
  targetPort: admin

# ── NetworkPolicy ─────────────────────────────────────────────────────────────
networkPolicy:
  # On by default: only keel's listener ports accept ingress, so a sidecar app
  # port (e.g. 3000) is not reachable from other pods to bypass keel's authn.
  # Egress stays open (DNS + allow-all; tighten with extraEgressRules).
  enabled: true
  # CIDR for kubelet liveness/readiness probe traffic.
  # Set to your node CIDR (e.g. "10.0.0.0/8").  Default allows all.
  kubeletCIDR: "0.0.0.0/0"
  # Namespace selector for admin port access (e.g. monitoring namespace).
  adminNamespaceSelector: {}
  # Extra ingress rules appended verbatim.
  extraIngressRules: []
  # Extra egress rules appended verbatim.
  extraEgressRules: []

# ── PodDisruptionBudget ───────────────────────────────────────────────────────
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1  (use one or the other, not both)

# ── RBAC / ServiceAccount ─────────────────────────────────────────────────────
serviceAccount:
  create: true
  # keel does not use the Kubernetes API; no token is mounted unless enabled.
  automountToken: false
  name: ""
  annotations: {}

rbac:
  # keel does not call the Kubernetes API, so it needs no ClusterRole. Enable only
  # if you extend keel with code that does.
  create: false

# ── Pod / container settings ──────────────────────────────────────────────────
podAnnotations: {}
podLabels: {}

terminationGracePeriodSeconds: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# keel derives GOMEMLIMIT from the container memory limit (90% of it), so a
# memory limit is always set. Raise both for high-throughput or sidecar-heavy pods.
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 128Mi
nodeSelector: {}
tolerations: []
affinity: {}
