apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keel.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "keel.name" . }}
    helm.sh/chart: {{ include "keel.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  # values.keel, with the schema's names and nesting, as keel.yaml (keel.settings in _helpers.tpl).
  keel.yaml: |
    keel:
      {{- include "keel.settings" . | nindent 6 }}
