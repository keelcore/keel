# tests/fixtures/container/values.yaml
# Helm values for deploying Keel to the local Apple container k8s cluster (P3.5).
# Single replica, HTTP only, no TLS, no authn — optimised for local dev testing.

fullnameOverride: keel

replicaCount: 1

image:
  repository: keel
  tag: test
  pullPolicy: Never   # the node reads it from the local image store (--shared-image-store)

mode: library

keel:
  # keel.yaml settings, with the config schema's names and nesting (pkg/config/schema.yaml).
  listeners:
    http:
      enabled: true
      port: 8080
    https:
      enabled: false
      port: 8443
    h3:
      enabled: false
      port: 8443
    health:
      enabled: true
      port: 9091
    ready:
      enabled: true
      port: 9092
    startup:
      enabled: false
      port: 9093
    admin:
      enabled: true
      port: 9999

  tls:
    acme:
      enabled: false
      domains: []
      email: ""
      ca_url: ""

  security:
    owasp_headers: true
    max_header_bytes: 65536
    max_request_body_bytes: 10485760
    max_response_body_bytes: 52428800
    hsts_max_age: 63072000

  timeouts:
    read_header: 5s
    read: 30s
    write: 30s
    idle: 60s
    shutdown_drain: 10s
    prestop_sleep: 3s

  limits:
    max_concurrent: 0
    queue_depth: 0

  backpressure:
    heap_max_bytes: 0
    high_watermark: 0.85
    low_watermark: 0.70
    shedding_enabled: false
    min_headroom_bytes: 10485760

  admin:
    pprof: false

  authn:
    enabled: false
    trusted_ids: []
    trusted_signers: []
    trusted_signers_file: ""
    my_id: ""
    my_signature_key_file: ""
    # Required aud claim on inbound JWTs (authn.audience); empty: not checked.
    audience: ""

  ext_authz:
    enabled: false
    endpoint: ""
    path: ""
    timeout: "500ms"
    transport: "http"
    fail_open: false

  logging:
    json: true
    level: debug
    access_log: true
    remote_sink:
      enabled: false
      endpoint: ""
      protocol: "http"

  audit:
    enabled: false
    file: ""
    rotation:
      max_size_mb: 100
      max_age_days: 0
      max_backups: 0
      compress: true
    remote_sink:
      enabled: false
      endpoint: ""
      protocol: "http"

  metrics:
    prometheus: true
    statsd:
      enabled: false
      endpoint: ""
      prefix: keel

  tracing:
    otlp:
      enabled: false
      endpoint: ""
      insecure: true

  fips:
    monitor: false

  sidecar:
    upstream_url: ""
    upstream_audience: ""
    upstream_tls:
      insecure_skip_verify: false
    upstream_health_path: "/health"
    upstream_health_interval: "10s"
    upstream_health_timeout: "2s"
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      reset_timeout: "30s"
    # Retries of an upstream connect that failed before any byte was sent (safe for every method).
    retry:
      dial_attempts: 3
      dial_backoff: "50ms"
    header_policy:
      forward: []
      strip: []
    xff_mode: "append"
    xff_trusted_hops: 0

service:
  type: ClusterIP
  annotations: {}
  http:
    enabled: true
    port: 8080
  https:
    enabled: false
    port: 8443
  h3:
    enabled: false
    port: 8443

serviceProbes:
  enabled: true
  healthPort: 9091
  readyPort: 9092
  startupPort: 9093

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi

podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: false
  kubeletCIDR: 0.0.0.0/0

serviceMonitor:
  enabled: false
