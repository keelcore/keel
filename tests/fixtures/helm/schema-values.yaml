# tests/fixtures/helm/schema-values.yaml
# Helm values setting every field of the config schema (pkg/config/schema.yaml) but the secrets
# (admin.token, admin.metrics_token, authn.oidc.client_secret), with the names and nesting of keel.yaml.
# make lint-helm-schema renders the chart with these values and fails when they drift from the schema:
# a field missing here, a key the schema does not define, or a value of the wrong type.

mode: sidecar
sidecar:
  app:
    image: placeholder

keel:
  listeners:
    http:
      enabled: true
      port: 8080
    https:
      enabled: false
      port: 8443
    h3:
      enabled: false
      port: 8443
    health:
      enabled: true
      port: 9091
    ready:
      enabled: true
      port: 9092
    startup:
      enabled: false
      port: 9093
    admin:
      enabled: false
      port: 9999

  tls:
    cert_file: ""
    key_file: ""
    client_ca_file: ""
    client_cert_notice: false
    notice:
      base_url: ""
      help_url: ""
      contact: ""
    acme:
      enabled: false
      domains: []
      email: ""
      cache_dir: /var/lib/keel/acme
      ca_url: ""
      ca_cert_file: ""
      challenge_port: 80

  sidecar:
    enabled: true
    upstream_url: "http://localhost:3000"
    upstream_audience: ""
    upstream_h2c: false
    upstream_health_path: "/health"
    upstream_health_interval: "10s"
    upstream_health_timeout: "2s"
    upstream_tls:
      enabled: false
      ca_file: ""
      client_cert_file: ""
      client_key_file: ""
      insecure_skip_verify: false
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      reset_timeout: "30s"
    retry:
      dial_attempts: 3
      dial_backoff: "50ms"
      honor_retry_after: false
    header_policy:
      forward: []
      strip: []
    xff_mode: "append"
    xff_trusted_hops: 0

  security:
    owasp_headers: true
    max_header_bytes: 65536
    max_request_body_bytes: 10485760
    max_response_body_bytes: 52428800
    hsts_max_age: 63072000
    alt_svc_max_age: 86400
    min_http_version: "1.1"

  timeouts:
    read_header: "5s"
    read: "30s"
    write: "30s"
    idle: "60s"
    shutdown_drain: "10s"
    prestop_sleep: "0s"

  limits:
    max_concurrent: 0
    queue_depth: 0

  backpressure:
    heap_max_bytes: 0
    high_watermark: 0.85
    low_watermark: 0.70
    shedding_enabled: true
    min_headroom_bytes: 10485760

  admin:
    pprof: false

  authn:
    enabled: true
    trusted_ids: []
    trusted_signers: []
    trusted_signers_file: ""
    my_id: ""
    my_signature_key_file: ""
    audience: ""
    oidc:
      enabled: false
      issuer: ""
      client_id: ""
      redirect_url: ""
      scopes: ["openid", "email", "profile"]
      cookie_key_file: ""
      ca_file: ""
      session_ttl: "8h"

  ext_authz:
    enabled: false
    endpoint: ""
    path: ""
    timeout: "500ms"
    transport: "http"
    fail_open: false

  logging:
    json: true
    level: "info"
    access_log: true
    remote_sink:
      enabled: false
      endpoint: ""
      protocol: "http"
    file: ""
    rotation:
      max_size_mb: 100
      max_age_days: 30
      max_backups: 5
      compress: true

  audit:
    enabled: false
    file: ""
    rotation:
      max_size_mb: 100
      max_age_days: 0
      max_backups: 0
      compress: true
    remote_sink:
      enabled: false
      endpoint: ""
      protocol: "http"

  metrics:
    prometheus: true
    statsd:
      enabled: false
      endpoint: ""
      prefix: "keel"

  tracing:
    otlp:
      enabled: false
      endpoint: ""
      insecure: false

  fips:
    monitor: true


