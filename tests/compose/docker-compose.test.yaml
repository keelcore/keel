# tests/compose/docker-compose.test.yaml
# Keel P3 integration test harness.
# Topology: upstream ← keel → prometheus / otel-collector → jaeger
#
# Usage:
#   scripts/test/compose.sh            # full run
#   docker compose --project-directory . -f tests/compose/docker-compose.test.yaml up -d --build
#   docker compose --project-directory . -f tests/compose/docker-compose.test.yaml down --volumes

services:

  # ── Upstream ────────────────────────────────────────────────────────────────
  # A simple HTTP echo server that keel will eventually proxy.
  # Present now so the full topology exists from day one.
  upstream:
    image: hashicorp/http-echo:1.0.0@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
    command: ["-text=upstream-ok", "-listen=:9000"]
    networks:
      - keel-test
    ports:
      - "9000:9000"

  # ── Keel ─────────────────────────────────────────────────────────────────────
  keel:
    build:
      context: .
      dockerfile: scripts/deploy/docker/Dockerfile
      args:
        FLAVOR: max   # max includes H3/QUIC; min has no_h3
    image: keel:test
    depends_on:
      - upstream
    networks:
      - keel-test
    volumes:
      - ./tests/fixtures:/etc/keel:ro   # certs land at /etc/keel/certs/ via gen-certs.sh
    environment:
      KEEL_CONFIG: /etc/keel/keel.yaml
      KEEL_SECRETS: /etc/keel/keel-secrets.yaml
    ports:
      - "8080:8080"         # HTTP main
      - "8443:8443"         # HTTPS
      - "8443:8443/udp"     # H3 (QUIC)
      - "9091:9091"         # /healthz
      - "9092:9092"         # /readyz
      - "9093:9093"         # /startupz
      - "9999:9999"         # admin (/metrics, /debug/pprof)

  # ── Jaeger (tracing backend) ──────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    networks:
      - keel-test
    ports:
      - "16686:16686"   # Jaeger UI (human inspection)
      # OTLP gRPC 4317 reachable inside the Docker network as jaeger:4317

  # ── OpenTelemetry Collector ───────────────────────────────────────────────────
  # Receives OTLP from keel; exports to Jaeger via internal Docker DNS.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    depends_on:
      - jaeger
    networks:
      - keel-test
    volumes:
      - ./tests/fixtures/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC  (keel → collector)
      - "4318:4318"   # OTLP HTTP  (keel → collector)

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    networks:
      - keel-test
    volumes:
      - ./tests/fixtures/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--log.level=warn"
    ports:
      - "9090:9090"   # Prometheus UI / query API

networks:
  keel-test:
    driver: bridge
