# tests/compose/k8s-stack.yaml
# Kubernetes equivalent of docker-compose.test.yaml for the Apple `container`
# harness. Same topology and service names, so the fixture configs resolve
# unchanged: upstream <- keel -> prometheus / otel-collector -> jaeger.
#
# Fixture files arrive as the `keel-fixtures` Secret and `otel-config` /
# `prometheus-config` ConfigMaps, created by scripts/k8s/deploy-k8s-stack.sh.
# Every port the compose tests use is a hostPort: bound on all node interfaces
# and wired node -> pod by the CNI portmap plugin (iptables), no proxies.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: upstream
spec:
  selector:
    matchLabels: { app: upstream }
  template:
    metadata:
      labels: { app: upstream }
    spec:
      containers:
        - name: upstream
          image: docker.io/hashicorp/http-echo:1.0.0@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
          args: ["-text=upstream-ok", "-listen=:9000"]
          ports:
            - { containerPort: 9000, hostPort: 9000 }
---
apiVersion: v1
kind: Service
metadata:
  name: upstream
spec:
  selector: { app: upstream }
  ports:
    - { name: http, port: 9000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel
spec:
  selector:
    matchLabels: { app: keel }
  template:
    metadata:
      labels: { app: keel }
    spec:
      containers:
        - name: keel
          image: docker.io/library/keel:test-max
          imagePullPolicy: Never
          env:
            - { name: KEEL_CONFIG, value: /etc/keel/keel.yaml }
            - { name: KEEL_SECRETS, value: /etc/keel/keel-secrets.yaml }
          ports:
            - { containerPort: 8080, hostPort: 8080, protocol: TCP }
            - { containerPort: 8443, hostPort: 8443, protocol: TCP }
            - { containerPort: 8443, hostPort: 8443, protocol: UDP }
            - { containerPort: 9091, hostPort: 9091, protocol: TCP }
            - { containerPort: 9092, hostPort: 9092, protocol: TCP }
            - { containerPort: 9093, hostPort: 9093, protocol: TCP }
            - { containerPort: 9999, hostPort: 9999, protocol: TCP }
          volumeMounts:
            - { name: fixtures, mountPath: /etc/keel, readOnly: true }
      volumes:
        - name: fixtures
          secret:
            secretName: keel-fixtures
            items:
              - { key: keel.yaml, path: keel.yaml }
              - { key: keel-secrets.yaml, path: keel-secrets.yaml }
              - { key: server.crt, path: certs/server.crt }
              - { key: server.key, path: certs/server.key }
---
apiVersion: v1
kind: Service
metadata:
  name: keel
spec:
  selector: { app: keel }
  ports:
    - { name: http, port: 8080, protocol: TCP }
    - { name: https, port: 8443, protocol: TCP }
    - { name: h3, port: 8443, protocol: UDP }
    - { name: health, port: 9091, protocol: TCP }
    - { name: ready, port: 9092, protocol: TCP }
    - { name: startup, port: 9093, protocol: TCP }
    - { name: admin, port: 9999, protocol: TCP }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mockupstream
spec:
  selector:
    matchLabels: { app: mockupstream }
  template:
    metadata:
      labels: { app: mockupstream }
    spec:
      containers:
        - name: mockupstream
          image: docker.io/library/keel-mockupstream:test
          imagePullPolicy: Never
          env:
            - { name: MOCK_UPSTREAM_ADDR, value: ":9300" }
            - { name: KEEL_HTTP_PORT, value: "9380" }
            - { name: KEEL_HEALTH_PORT, value: "9381" }
            - { name: KEEL_READY_PORT, value: "9382" }
          ports:
            - { containerPort: 9300 }
            - { containerPort: 9380, hostPort: 9380 }
          readinessProbe:
            httpGet: { path: /readyz, port: 9382 }
            periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: mockupstream
spec:
  selector: { app: mockupstream }
  ports:
    - { name: upstream, port: 9300 }
    - { name: control, port: 9380 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel-sidecar
spec:
  selector:
    matchLabels: { app: keel-sidecar }
  template:
    metadata:
      labels: { app: keel-sidecar }
    spec:
      containers:
        - name: keel-sidecar
          image: docker.io/library/keel:test-max
          imagePullPolicy: Never
          env:
            - { name: KEEL_CONFIG, value: /etc/keel/keel-sidecar.yaml }
          ports:
            - { containerPort: 8180, hostPort: 8180, protocol: TCP }
            - { containerPort: 9192, hostPort: 9192, protocol: TCP }
            - { containerPort: 9199, hostPort: 9199, protocol: TCP }
          readinessProbe:
            httpGet: { path: /readyz, port: 9192 }
            periodSeconds: 1
          volumeMounts:
            - { name: fixtures, mountPath: /etc/keel, readOnly: true }
      volumes:
        - name: fixtures
          secret:
            secretName: keel-fixtures
            items:
              - { key: keel-sidecar.yaml, path: keel-sidecar.yaml }
              - { key: sidecar-sign.key, path: certs/sidecar-sign.key }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
spec:
  selector:
    matchLabels: { app: dex }
  template:
    metadata:
      labels: { app: dex }
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.46.1@sha256:65b72ca0f4b0bf6d4ada84ec21da8851782563404ac7b8f926923d27ceced9ab
          args: ["dex", "serve", "/etc/keel/dex.yaml"]
          ports:
            - { containerPort: 5556, hostPort: 5556, protocol: TCP }
          readinessProbe:
            httpGet: { path: /dex/healthz, port: 5556, scheme: HTTPS }
            periodSeconds: 1
          volumeMounts:
            - { name: fixtures, mountPath: /etc/keel, readOnly: true }
      volumes:
        - name: fixtures
          secret:
            secretName: keel-fixtures
            items:
              - { key: dex.yaml, path: dex.yaml }
              - { key: server.crt, path: certs/server.crt }
              - { key: server.key, path: certs/server.key }
---
apiVersion: v1
kind: Service
metadata:
  name: dex
spec:
  selector: { app: dex }
  ports:
    - { name: https, port: 5556 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keel-oidc
spec:
  selector:
    matchLabels: { app: keel-oidc }
  template:
    metadata:
      labels: { app: keel-oidc }
    spec:
      containers:
        - name: keel-oidc
          image: docker.io/library/keel:test-max
          imagePullPolicy: Never
          env:
            - { name: KEEL_CONFIG, value: /etc/keel/keel-oidc.yaml }
          ports:
            - { containerPort: 8280, hostPort: 8280, protocol: TCP }
            - { containerPort: 9292, hostPort: 9292, protocol: TCP }
          readinessProbe:
            httpGet: { path: /readyz, port: 9292 }
            periodSeconds: 1
          volumeMounts:
            - { name: fixtures, mountPath: /etc/keel, readOnly: true }
      volumes:
        - name: fixtures
          secret:
            secretName: keel-fixtures
            items:
              - { key: keel-oidc.yaml, path: keel-oidc.yaml }
              - { key: oidc-cookie.key, path: certs/oidc-cookie.key }
              - { key: ca.crt, path: certs/ca.crt }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: docker.io/jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
          ports:
            - { containerPort: 16686 }
            - { containerPort: 4317 }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686 }
    - { name: otlp-grpc, port: 4317 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      containers:
        - name: otel-collector
          image: docker.io/otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - { containerPort: 4317 }
            - { containerPort: 4318 }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol-contrib, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: otel-config
            items:
              - { key: otel-collector.yaml, path: config.yaml }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317 }
    - { name: otlp-http, port: 4318 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--log.level=warn"
          ports:
            - { containerPort: 9090, hostPort: 9090 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: { app: prometheus }
  ports:
    - { name: http, port: 9090 }
